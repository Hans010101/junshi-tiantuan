name: Deploy to Cloudflare 002

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test:email
      - run: pnpm run build
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm exec wrangler deploy --config dist/junshi_tiantuan/wrangler.json
      - name: Explain skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo 'Build passed; deployment is waiting for the CLOUDFLARE_API_TOKEN repository secret.'
